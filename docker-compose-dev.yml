version: "3"

services:
  app:
    image: mavedb-api/mavedb-api:dev
    build:
      context: .
      target: application
    command: bash -c "uvicorn mavedb.server_main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - db
      - redis
      - moto-init
    env_file:
      - settings/.env.dev
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_IP: redis
      REDIS_PORT: 6379
      REDIS_SSL: "false"
      LOG_CONFIG: dev
      PYTHONPATH: "/variant-annotation:/code/src"
    ports:
      - "8002:8000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - .:/code
      - ../variant-annotation:/variant-annotation
      - mavedb-seqrepo-dev:/usr/local/share/seqrepo

  worker:
    image: mavedb-api/mavedb-worker:dev
    build:
      context: .
      target: worker
    command: bash -c "arq mavedb.worker.WorkerSettings --watch ./src"
    env_file:
      - settings/.env.dev
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_IP: redis
      REDIS_PORT: 6379
      REDIS_SSL: "false"
      LOG_CONFIG: dev
      PYTHONPATH: "/variant-annotation:/code/src"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - .:/code
      - ../variant-annotation:/variant-annotation
      - mavedb-seqrepo-dev:/usr/local/share/seqrepo
    depends_on:
      - db
      - redis
      - moto-init

  dcd-mapping:
    build: ../dcd_mapping
    platform: linux/amd64
    image: dcd-mapping:dev
    command: bash -c "uvicorn api.server_main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - db
      - seqrepo
    env_file:
      - settings/.env.dev
    ports:
      - "8004:8000"
    volumes:
      - ../dcd_mapping:/usr/src/app
      - mavedb-seqrepo-dev:/usr/local/share/seqrepo

  cdot-rest:
    build: ../cdot_rest
    image: cdot-rest:dev
    command: bash -c "gunicorn cdot_rest.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - settings/.env.dev
    depends_on:
      - redis
      - seqrepo
    ports:
      - "8006:8000"
    volumes:
      - mavedb-seqrepo-dev:/usr/local/share/seqrepo

  db:
    image: postgres:14
    env_file:
      - settings/.env.dev
    ports:
      - "5434:5432"
    volumes:
      - mavedb-data-dev:/var/lib/postgresql/data

  redis:
    image: redis:7.2.3
    env_file:
      - settings/.env.dev
    ports:
      - "6381:6379"
    volumes:
      - mavedb-redis-dev:/data

  # AWS mock.
  moto:
    image: motoserver/moto:latest
    ports:
      - "5001:5000"

  moto-init:
    # One-shot: create the upload bucket once moto is up (moto has no auto-create).
    # A raw PUT is all it takes; --retry-all-errors waits out moto's startup.
    image: curlimages/curl:latest
    depends_on:
      - moto
    command: -sf --retry 10 --retry-all-errors --retry-delay 1 -X PUT http://moto:5000/score-set-csv-uploads-dev

  seqrepo:
    image: biocommons/seqrepo:2024-12-20
    volumes:
      - mavedb-seqrepo-dev:/usr/local/share/seqrepo

volumes:
  mavedb-data-dev:
  mavedb-redis-dev:
  mavedb-seqrepo-dev:
