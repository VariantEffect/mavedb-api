name: Run Tests
on:
  push:
    branches:
      - main
      - 'release-*'
  pull_request:

env:
  LOG_CONFIG: test

jobs:
  run-checks:
    runs-on: ubuntu-latest
    name: Lint, format and type checks (bin/check)
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    - run: sudo apt-get update
    - run: sudo apt-get install -y tabix
    - run: pip install --upgrade pip
    - run: pip install poetry
    - run: poetry install --with dev --extras server
    - run: bin/check

  replay-migrations:
    runs-on: ubuntu-latest
    name: Replay migrations on an empty database
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mavedb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE_NAME: mavedb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    - run: pip install --upgrade pip
    - run: pip install poetry
    - run: poetry install --with dev --extras server
    - run: poetry run alembic upgrade head
    - name: Check there is exactly one head
      run: test "$(poetry run alembic heads | wc -l)" -eq 1

  run-tests-3_11-core-dependencies:
    runs-on: ubuntu-latest
    name: Pytest on Core Dependencies-- Python 3.11
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    - run: pip install --upgrade pip
    - run: pip install poetry
    - run: poetry install --with dev
    - name: Run fast tests on PRs
      if: github.event_name == 'pull_request'
      run: bin/t tests/ -m "not network and not slow"
    - name: Run full tests on main and release branches
      if: github.event_name == 'push'
      run: bin/t tests/

  run-tests-3_12-core-dependencies:
    runs-on: ubuntu-latest
    name: Pytest on Core Dependencies-- Python 3.12
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - run: pip install --upgrade pip
    - run: pip install poetry
    - run: poetry install --with dev
    - name: Run fast tests on PRs
      if: github.event_name == 'pull_request'
      run: bin/t tests/ -m "not network and not slow"
    - name: Run all tests on main and release branches
      if: github.event_name == 'push'
      run: bin/t tests/

  run-tests-3_11:
    runs-on: ubuntu-latest
    name: Pytest on Optional Dependencies-- Python 3.11
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    - run: sudo apt-get update
    - run: sudo apt-get install -y tabix
    - run: pip install --upgrade pip
    - run: pip install poetry
    - run: poetry install --with dev --extras server
    - name: Run fast tests with coverage on PRs
      if: github.event_name == 'pull_request'
      run: |
        mkdir -p coverage
        bin/t tests/ -m "not network and not slow" --show-capture=stdout --cov=src --cov-report=term-missing --cov-report=lcov:coverage/lcov.info
    - name: Run all tests with coverage on main and release branches
      if: github.event_name == 'push'
      run: |
        mkdir -p coverage
        bin/t tests/ --show-capture=stdout --cov=src --cov-report=term-missing --cov-report=lcov:coverage/lcov.info
    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        path-to-lcov: coverage/lcov.info
