# Ruff runs from the Poetry environment so poetry.lock is the only place its version is pinned.
# --force-exclude keeps pyproject's `exclude` in effect when pre-commit passes file paths explicitly.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: poetry run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
